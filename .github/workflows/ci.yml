name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: absensi
          POSTGRES_PASSWORD: absensi
          POSTGRES_DB: absensi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U absensi -d absensi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://absensi_app:absensi_app@localhost:5432/absensi
      DIRECT_URL: postgresql://absensi:absensi@localhost:5432/absensi
      AUTH_URL: http://localhost:3000
      STORAGE_DIR: ./storage
      AUTH_SECRET: ci-only-change-me-use-32chars-min
      SEED_PASSWORD: DevPassword123!
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@example.com
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm db:ensure-role
      - run: pnpm prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --coverage
